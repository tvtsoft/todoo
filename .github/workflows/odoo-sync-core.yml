# Đồng bộ Odoo core → mirror Todoo (giữ history · ghim SHA · có gate)
#
# ĐẶT Ở ĐÂU: repo mirror của bạn, đường dẫn .github/workflows/odoo-sync-core.yml
#            (bản trong OSHM/docs/git_setting/ chỉ là bản gốc để tra cứu/PR)
# CẦN KÈM  : ci/core_tree.py + ci/sync_filter.json  ← copy từ OSHM/docs/git_setting/ci/
#
# NGUYÊN TẮC:
#   1. Workflow CHỈ ghi vào nhánh `<major>-upstream`. Không bao giờ chạm
#      *-dev / *-sandbox / *-prod → không thể xoá mất việc của bạn.
#   2. GIỮ history: clone mirror rồi thay ruột, không `rm -rf .git` + `git init`.
#      → mỗi tuần 1 commit có diff thật, merge-base còn nguyên, promote chạy được.
#   3. Ghim SHA upstream vào CORE_PIN.txt + commit message + tag.
#   4. Gate đỏ = KHÔNG push. Thà không sync còn hơn sync một cây gãy.
#
# LẦN ĐẦU CHẠY, LÀM 3 VIỆC NÀY TRƯỚC:
#   - Settings → Actions → General → Workflow permissions = "Read and write"
#   - Tạo sẵn nhánh đích promote: 18.0-dev, 19.0-dev (workflow sẽ mở PR vào đó)
#   - Chạy tay 1 lần với dry_run = true, đọc phần Summary

name: Sync Odoo core → mirror (lọc VN)

on:
  workflow_dispatch:
    inputs:
      branches:
        description: 'Nhánh Odoo cần sync (phẩy)'
        default: '18.0,19.0'
        type: string
      dry_run:
        description: 'Chỉ chạy thử — lọc + gate, KHÔNG push'
        default: false
        type: boolean
  schedule:
    - cron: '0 18 * * 6'      # 01:00 sáng CN giờ VN (UTC+7)

permissions:
  contents: write
  pull-requests: write

concurrency:                   # hai lần chạy chồng nhau = push đè nhau
  group: sync-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          RAW="${{ inputs.branches || '18.0,19.0' }}"
          echo "matrix=$(echo "$RAW" | tr ',' '\n' | grep -v '^$' \
            | jq -Rsc 'split("\n") | map(select(length>0))')" >> "$GITHUB_OUTPUT"

  sync:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      # ---------------------------------------------------------------- 1
      - name: 📦 Lấy script gác (từ nhánh mặc định của mirror)
        uses: actions/checkout@v4
        with:
          path: tooling

      - name: 📥 Clone Odoo gốc (shallow — chỉ cần cây, không cần history của họ)
        run: |
          git clone --depth 1 --branch "${{ matrix.branch }}" \
            https://github.com/odoo/odoo.git upstream
          SHA=$(git -C upstream rev-parse HEAD)
          echo "UPSTREAM_SHA=$SHA"        >> "$GITHUB_ENV"
          echo "UPSTREAM_SHORT=${SHA:0:12}" >> "$GITHUB_ENV"
          echo "UPSTREAM_DATE=$(git -C upstream log -1 --format=%cI)" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------- 2
      - name: 🧹 Lọc .po + l10n + dọn module mồ côi
        id: filter
        run: |
          python3 tooling/ci/core_tree.py filter \
            --tree upstream --config tooling/ci/sync_filter.json --apply

      - name: ✅ GATE — cây phải sạch mới được đi tiếp
        run: |
          python3 tooling/ci/core_tree.py validate \
            --tree upstream --config tooling/ci/sync_filter.json

      # ---------------------------------------------------------------- 3
      - name: 📌 Ghim SHA upstream vào cây
        run: |
          rm -rf upstream/.git
          cat > upstream/CORE_PIN.txt <<EOF
          upstream_repo   = https://github.com/odoo/odoo
          upstream_branch = ${{ matrix.branch }}
          upstream_sha    = ${{ env.UPSTREAM_SHA }}
          upstream_date   = ${{ env.UPSTREAM_DATE }}
          synced_at       = $(date -u +%FT%TZ)
          synced_by       = ${{ github.workflow }} #${{ github.run_number }}
          filter          = ci/sync_filter.json
          EOF
          cat upstream/CORE_PIN.txt

      # ---------------------------------------------------------------- 4
      - name: 🔁 Thay ruột mirror — GIỮ history
        id: commit
        run: |
          BR="${{ matrix.branch }}-upstream"
          git clone --branch "$BR" --single-branch \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            mirror 2>/dev/null || {
              echo "Nhánh $BR chưa có → tạo mới (lần đầu)"
              git clone --no-checkout \
                "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" mirror
              git -C mirror checkout --orphan "$BR"
              git -C mirror rm -rfq --cached . 2>/dev/null || true
            }

          # --delete: cây mirror phải khớp HỆT upstream đã lọc.
          # --exclude .git  : không đụng history.
          # --exclude .github: phòng khi lỡ có workflow nằm trên nhánh này.
          rsync -a --delete --exclude=.git --exclude=.github upstream/ mirror/

          cd mirror
          git config user.name  "todoo-sync[bot]"
          git config user.email "todoo-sync[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "→ Odoo không đổi gì so với lần sync trước. Không tạo commit."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "files=$(git diff --cached --name-only | wc -l)" >> "$GITHUB_OUTPUT"
          git commit -q -m "Sync Odoo ${{ matrix.branch }} @ ${{ env.UPSTREAM_SHORT }}" \
                        -m "upstream_sha: ${{ env.UPSTREAM_SHA }}
          upstream_date: ${{ env.UPSTREAM_DATE }}
          filter: giữ vi/vi_VN .po + l10n_vn* ; đã dọn module mồ côi
          run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git tag "sync/${{ matrix.branch }}/$(date -u +%F)-${{ github.run_number }}"

      # ---------------------------------------------------------------- 5
      - name: 🚀 Push (không --force)
        if: steps.commit.outputs.changed == 'true' && !inputs.dry_run
        working-directory: mirror
        run: git push origin "${{ matrix.branch }}-upstream" --follow-tags

      - name: 🔀 Mở/cập nhật PR vào nhánh dev — chỗ bạn bấm duyệt
        if: steps.commit.outputs.changed == 'true' && !inputs.dry_run
        working-directory: mirror
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE="${{ matrix.branch }}-dev"
          HEAD="${{ matrix.branch }}-upstream"
          git ls-remote --exit-code --heads origin "$BASE" >/dev/null 2>&1 || {
            echo "::warning::Chưa có nhánh $BASE — bỏ qua bước mở PR."; exit 0; }
          if gh pr list --head "$HEAD" --base "$BASE" --state open \
               --json number --jq 'length' | grep -qv '^0$'; then
            echo "PR đang mở sẵn — commit mới đã tự vào PR đó."
          else
            gh pr create --base "$BASE" --head "$HEAD" \
              --title "Sync Odoo ${{ matrix.branch }} @ ${{ env.UPSTREAM_SHORT }}" \
              --body "Tự động từ upstream \`${{ env.UPSTREAM_SHA }}\`.

          **Trước khi merge, đọc diff và trả lời 2 câu:**
          1. Có đụng module mình đang kế thừa/ghi đè không? → nếu có, ghi vào \`saas.release.module_ids\`.
          2. Đây là \`core_sync\` → theo thiết kế tổng thể phải **soak nonprod ≥ 48h**, không đi đường tắt.

          Gate đã xanh: dependency khép kín · đủ module bắt buộc · .pot còn nguyên."
          fi

      # ---------------------------------------------------------------- 6
      - name: 📊 Tóm tắt (đọc 10 giây là đủ)
        if: always()
        run: |
          {
            echo "## Odoo ${{ matrix.branch }}"
            echo ""
            echo "| Mục | Giá trị |"
            echo "|---|---|"
            echo "| Upstream SHA | \`${{ env.UPSTREAM_SHORT }}\` |"
            echo "| Ngày commit gốc | ${{ env.UPSTREAM_DATE }} |"
            echo "| Có thay đổi | ${{ steps.commit.outputs.changed || 'n/a' }} |"
            echo "| File đổi | ${{ steps.commit.outputs.files || 0 }} |"
            echo "| .po đã xoá | ${{ steps.filter.outputs.removed_po || 0 }} |"
            echo "| l10n đã xoá | ${{ steps.filter.outputs.removed_l10n || 0 }} |"
            echo "| Mồ côi đã dọn | ${{ steps.filter.outputs.removed_orphan || 0 }} |"
            echo "| Dry run | ${{ inputs.dry_run || false }} |"
          } >> "$GITHUB_STEP_SUMMARY"
